<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>猫超数据下载</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css?v=20260817h">
</head>
<body>
  <svg class="icon-defs" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-4L3 10m0-4v4h4M4 13a8 8 0 0 0 14.9 4L21 14m0 4v-4h-4"/></symbol>
      <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 20h16"/></symbol>
      <symbol id="icon-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
      <symbol id="icon-play" viewBox="0 0 24 24"><path d="m9 5 9 7-9 7V5Z"/></symbol>
      <symbol id="icon-chevron-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
      <symbol id="icon-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="icon-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="icon-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h5M9 13h6M9 17h6"/></symbol>
      <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/><path d="M3 7V5h6l2 2"/></symbol>
      <symbol id="icon-image" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="m5 17 4-4 3 3 2-2 5 5"/></symbol>
      <symbol id="icon-edit" viewBox="0 0 24 24"><path d="m4 16.5-.8 3.3 3.3-.8L18 7.5 15.5 5 4 16.5ZM14.5 6 17 8.5M4 20h16"/></symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="icon-alert" viewBox="0 0 24 24"><path d="M12 4 21 20H3L12 4Z"/><path d="M12 9v5m0 3h.01"/></symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    </defs>
  </svg>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">超</span>
        <div>
          <h1>猫超数据下载</h1>
          <p>组员 · 日期 · 目录 · 文件</p>
        </div>
      </div>
      <div class="topbar-actions">
        <label class="operator-pick">
          <span>组员</span>
          <select id="operator-select" aria-label="当前组员"></select>
        </label>
        <button id="nav-home" class="nav-link active" data-view="home" type="button">首页</button>
        <button id="nav-settings" class="nav-link" data-view="settings" type="button">设置</button>
        <button id="nav-repair" class="nav-quiet" data-view="repair" type="button">维护</button>
      </div>
    </div>
  </header>

  <main class="shell">
    <section id="connection-banner" class="connection-banner hidden" aria-live="polite"></section>

    <section id="view-home" class="view">
      <article id="today-hero" class="hero">
        <div class="hero-copy">
          <p class="eyebrow">今天</p>
          <h2 id="hero-title">开始下载</h2>
          <p id="run-hint" class="hero-hint"></p>
        </div>
        <div class="hero-actions">
          <button id="full-run-button" class="button button-primary hero-run" type="button">
            <svg class="icon" aria-hidden="true"><use href="#icon-download"></use></svg>
            <span id="full-run-label">开始下载</span>
          </button>
          <button id="cancel-run-button" class="button button-secondary hero-cancel hidden" type="button">取消</button>
        </div>
      </article>

      <article class="block block-muted">
        <div class="block-head">
          <h2>今日进度</h2>
          <p id="progress-caption" class="muted"></p>
        </div>
        <div id="progress-board" class="progress-board"></div>
        <p id="cell-detail" class="cell-detail hidden"></p>
      </article>

      <article class="block">
        <div class="block-head">
          <h2>文件柜</h2>
          <div class="inline-actions">
            <select id="cabinet-supplier-filter" aria-label="按供应商筛选">
              <option value="">全部供应商</option>
            </select>
            <button id="cabinet-pack" class="button button-secondary" type="button">全部下载</button>
          </div>
        </div>
        <nav id="cabinet-crumb" class="crumb" aria-label="文件路径"></nav>
        <div id="cabinet-list" class="cabinet-list"></div>
      </article>

      <article class="block">
        <div class="block-head">
          <h2>目前进程</h2>
          <p id="process-caption" class="muted"></p>
        </div>
        <div id="process-summary" class="queue-summary process-summary"></div>
        <div id="process-list" class="queue-list process-list"></div>
      </article>
    </section>

    <section id="view-settings" class="view hidden">
      <article class="block">
        <div class="block-head">
          <h2>组员</h2>
        </div>
        <div id="operator-list" class="pick-list"></div>
        <div class="operator-bar">
          <input id="operator-name-input" placeholder="组员姓名" autocomplete="off">
          <button id="add-operator-button" class="button button-secondary" type="button">新增</button>
        </div>
      </article>

      <article class="block block-muted">
        <div class="block-head">
          <h2>供应商</h2>
          <button id="sync-suppliers-button" class="button button-secondary" type="button">同步清单</button>
        </div>
        <div class="sync-account-panel">
          <div class="sync-account-head">
            <strong>同步账号</strong>
            <div class="inline-actions">
              <button id="sync-accounts-all" class="text-button" type="button">全选</button>
              <button id="sync-accounts-none" class="text-button" type="button">清空</button>
            </div>
          </div>
          <div id="sync-account-list" class="account-selection"></div>
        </div>
        <div id="suppliers-table" class="pick-list"></div>
      </article>

      <article class="block">
        <details id="skip-panel" class="fold">
          <summary>本次下载供应商</summary>
          <div id="supplier-selection" class="pick-list"></div>
        </details>
      </article>
    </section>

    <section id="view-repair" class="view hidden">
      <article class="block">
        <div class="block-head">
          <h2>机器</h2>
          <div class="inline-actions">
            <button id="close-idle-browsers-button" class="button button-secondary" type="button">关闭空闲浏览器</button>
            <button id="refresh-button" class="text-button" type="button">刷新</button>
          </div>
        </div>
        <p id="repair-machine" class="repair-line"></p>
        <label class="toggle">
          <input id="headed-input" type="checkbox" checked>
          <span class="toggle-track"></span>
          <span>显示浏览器</span>
        </label>
      </article>

      <article class="block block-muted">
        <div class="block-head">
          <h2>未完成</h2>
          <span id="repair-job-caption" class="muted"></span>
        </div>
        <div id="repair-jobs" class="repair-list"></div>
      </article>

      <article class="block">
        <div class="block-head">
          <h2>失败</h2>
        </div>
        <div id="repair-errors" class="repair-list"></div>
      </article>

      <article class="block block-muted">
        <div class="block-head">
          <h2>猫超账户</h2>
          <button id="add-account-button" class="button button-secondary" type="button">新增账号</button>
        </div>
        <div id="accounts-table-wrap" class="table-wrap">
          <table class="settings-table">
            <thead>
              <tr>
                <th>手机号</th>
                <th>浏览器</th>
                <th>启用</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="accounts-table"></tbody>
          </table>
        </div>
      </article>
    </section>
  </main>

  <div id="account-modal" class="modal-backdrop hidden" role="presentation">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="account-modal-title">
      <div class="modal-heading">
        <div>
          <span class="eyebrow">猫超账户</span>
          <h2 id="account-modal-title">新增账号</h2>
        </div>
        <button class="icon-button" data-close-modal="account-modal" type="button" aria-label="关闭">
          <svg class="icon" aria-hidden="true"><use href="#icon-x"></use></svg>
        </button>
      </div>
      <form id="account-form">
        <p id="account-modal-hint" class="muted hidden"></p>
        <div class="form-grid">
          <label class="account-system-field">账号标识<input id="account-key" name="key"></label>
          <label>手机号<input id="account-username" name="username" inputmode="numeric" required></label>
          <label>显示名称<input id="account-name" name="name"></label>
          <label class="account-system-field">浏览器端口<input id="account-port" name="port" type="number" min="1" max="65535"></label>
          <label class="account-system-field">Profile 目录<input id="account-profile" name="profile_dir"></label>
          <label class="account-system-field">下载目录<input id="account-download" name="download_dir"></label>
          <label class="wide">登录密码<input id="account-password" name="password" type="password" autocomplete="new-password"></label>
          <label class="wide">备注<textarea id="account-note" name="note" rows="3"></textarea></label>
        </div>
        <label class="toggle form-toggle">
          <input id="account-enabled" name="enabled" type="checkbox" checked>
          <span class="toggle-track"></span>
          <span>启用账号</span>
        </label>
        <div class="modal-actions">
          <button class="button button-secondary" data-close-modal="account-modal" type="button">取消</button>
          <button class="button button-primary" type="submit">保存账号</button>
        </div>
      </form>
    </div>
  </div>

  <div id="risk-modal" class="modal-backdrop hidden" role="presentation">
    <div class="modal modal-compact" role="dialog" aria-modal="true" aria-labelledby="risk-modal-title">
      <div class="modal-heading">
        <div>
          <span class="eyebrow">确认</span>
          <h2 id="risk-modal-title">开始下载</h2>
        </div>
        <button class="icon-button" data-close-modal="risk-modal" type="button" aria-label="关闭">
          <svg class="icon" aria-hidden="true"><use href="#icon-x"></use></svg>
        </button>
      </div>
      <p class="risk-note">将接管猫超浏览器并按所选供应商下载 6 类表格。</p>
      <ul class="risk-list risk-list-compact">
        <li>运行时不要操作被接管的浏览器。</li>
        <li>登录失效、页面卡住或无数据时，可能没有文件。</li>
        <li>失败后先看进度和维护页，再决定是否重试。</li>
      </ul>
      <label class="ack-row">
        <input id="risk-ack" type="checkbox">
        <span>我已确认以上提醒。</span>
      </label>
      <div class="modal-actions">
        <button class="button button-secondary" data-close-modal="risk-modal" type="button">取消</button>
        <button id="risk-confirm-button" class="button button-primary" type="button" disabled>确认并开始</button>
      </div>
    </div>
  </div>

  <div id="log-modal" class="modal-backdrop hidden" role="presentation">
    <div class="modal modal-large" role="dialog" aria-modal="true" aria-labelledby="log-modal-title">
      <div class="modal-heading">
        <div>
          <span class="eyebrow">日志</span>
          <h2 id="log-modal-title">日志</h2>
        </div>
        <button class="icon-button" data-close-modal="log-modal" type="button" aria-label="关闭">
          <svg class="icon" aria-hidden="true"><use href="#icon-x"></use></svg>
        </button>
      </div>
      <pre id="log-content" class="log-content">读取中</pre>
    </div>
  </div>

  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script src="/static/app.js?v=20260817h" defer></script>
</body>
</html>
